[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "stas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "neo4j>=5.19",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "networkx>=3.3",
    "scipy>=1.13",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "anthropic>=0.28",
    "aiokafka>=0.11",
    "fastavro>=1.9",
    "prometheus-client>=0.20",
    "redis[asyncio]>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "testcontainers[neo4j]>=4.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-networkx>=3.3",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["simulation*", "pipelines*", "graph*"]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"simulation/tests/*" = ["ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "simulation/tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["apps/api", "simulation"]
omit = ["*/tests/*", "*/__init__.py", "*/scripts/*"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
