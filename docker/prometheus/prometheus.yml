global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: stas

scrape_configs:
  - job_name: stas-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: stas-telemetry
    static_configs:
      - targets: ["telemetry:9090"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
