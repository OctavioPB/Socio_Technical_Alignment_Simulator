apiVersion: apps/v1
kind: Deployment
metadata:
  name: stas-web
  namespace: stas
  labels:
    app: stas-web
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stas-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: stas-web
        component: frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/stas/web:0.4.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: stas-config
            - secretRef:
                name: stas-secrets
          env:
            # API_URL uses cluster-internal DNS — not exposed publicly
            - name: API_URL
              value: "http://stas-api.stas.svc.cluster.local"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
