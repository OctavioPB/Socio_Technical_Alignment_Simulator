apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stas-ingress
  namespace: stas
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # SSE: disable buffering so simulation stream events reach the client immediately
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.stas.io
        - api.stas.io
      secretName: stas-tls
  rules:
    - host: app.stas.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stas-web
                port:
                  number: 80
    - host: api.stas.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stas-api
                port:
                  number: 80
