apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: stas
  labels:
    app: neo4j
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet DNS
